<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India GeoNames Gazetteer — 660,000+ Geographic Points Map</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #0f172a;
      color: #f8fafc;
    }
    #map {
      height: 100%;
      width: 100%;
      z-index: 1;
    }

    /* Glassmorphism Panels */
    .hud-panel {
      position: absolute;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      color: #f1f5f9;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Header & Search HUD */
    .header-hud {
      top: 16px;
      left: 16px;
      width: 380px;
      padding: 16px 20px;
    }
    .header-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .header-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .search-box {
      position: relative;
      width: 100%;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      opacity: 0.6;
    }
    .search-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      max-height: 240px;
      overflow-y: auto;
      display: none;
      z-index: 1100;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
    }
    .search-item {
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.15s;
    }
    .search-item:hover {
      background: #334155;
    }
    .search-item-meta {
      font-size: 11px;
      color: #94a3b8;
    }

    /* Filters & Controls HUD */
    .controls-hud {
      top: 16px;
      right: 16px;
      width: 290px;
      padding: 16px;
    }
    .controls-section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
    }
    .filter-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .filter-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-P { background: #38bdf8; }
    .dot-H { background: #06b6d4; }
    .dot-T { background: #eab308; }
    .dot-A { background: #ec4899; }
    .dot-S { background: #a855f7; }
    .dot-V { background: #22c55e; }

    .slider-row {
      margin-bottom: 12px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .slider-input {
      width: 100%;
      accent-color: #38bdf8;
    }

    .action-btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .hud-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .hud-btn:hover {
      background: #334155;
      border-color: #38bdf8;
    }
    .hud-btn.active-mode {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border-color: transparent;
    }

    /* Live Status Bottom Bar */
    .status-hud {
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 12px;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-value {
      font-weight: 700;
      color: #38bdf8;
    }
    .status-divider {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.15);
    }

    /* Custom Leaflet Popup */
    .leaflet-popup-content-wrapper {
      background: #0f172a !important;
      color: #f8fafc !important;
      border-radius: 12px !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5) !important;
      font-family: 'Inter', sans-serif !important;
    }
    .leaflet-popup-tip {
      background: #0f172a !important;
    }
    .popup-title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    .popup-type {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .popup-table {
      font-size: 12px;
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 8px;
    }
    .popup-table td {
      padding: 3px 0;
    }
    .popup-table td:first-child {
      color: #94a3b8;
      width: 80px;
    }
    .popup-table td:last-child {
      color: #e2e8f0;
      font-weight: 500;
    }
    .popup-link {
      display: inline-block;
      font-size: 11px;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      margin-top: 4px;
    }
    .popup-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Main Map Container -->
  <div id="map"></div>

  <!-- Header & Live Search HUD -->
  <div class="hud-panel header-hud">
    <div class="header-title-row">
      <div class="header-title">
        <span>🇮🇳 India GeoNames Map</span>
      </div>
      <span class="badge">660,045 Points</span>
    </div>
    
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Search city, town, hill, river (e.g. Pune)..." autocomplete="off">
      <div id="searchDropdown" class="search-dropdown"></div>
    </div>
  </div>

  <!-- Controls & Category Filters HUD -->
  <div class="hud-panel controls-hud">
    <div class="controls-section-title">Feature Filter</div>
    <div class="filter-grid">
      <button class="filter-btn active" data-class="P">
        <span class="filter-dot dot-P"></span> Cities/Towns
      </button>
      <button class="filter-btn active" data-class="H">
        <span class="filter-dot dot-H"></span> Rivers/Lakes
      </button>
      <button class="filter-btn active" data-class="T">
        <span class="filter-dot dot-T"></span> Hills/Peaks
      </button>
      <button class="filter-btn active" data-class="A">
        <span class="filter-dot dot-A"></span> Admin Divs
      </button>
      <button class="filter-btn active" data-class="S">
        <span class="filter-dot dot-S"></span> POIs / Stations
      </button>
      <button class="filter-btn active" data-class="V">
        <span class="filter-dot dot-V"></span> Forests/Parks
      </button>
    </div>

    <div class="slider-row">
      <div class="slider-header">
        <span>Min Population</span>
        <span id="popLabel">All Places</span>
      </div>
      <input type="range" id="popSlider" class="slider-input" min="0" max="100000" step="5000" value="0">
    </div>

    <div class="controls-section-title" style="margin-top: 14px;">Visualization Mode</div>
    <div class="action-btn-row">
      <button id="btnPointsMode" class="hud-btn active-mode">📍 Dynamic Points</button>
      <button id="btnHeatmapMode" class="hud-btn">🔥 Nationwide Heatmap</button>
    </div>

    <div class="action-btn-row" style="margin-top: 8px;">
      <button id="btnResetView" class="hud-btn">🎯 Fit India View</button>
    </div>
  </div>

  <!-- Status HUD -->
  <div class="hud-panel status-hud">
    <div class="status-item">
      <span>Database:</span>
      <span class="status-value">660,045</span>
    </div>
    <div class="status-divider"></div>
    <div class="status-item">
      <span>Visible Viewport:</span>
      <span id="visibleCount" class="status-value">Loading...</span>
    </div>
    <div class="status-divider"></div>
    <div class="status-item">
      <span>Zoom Level:</span>
      <span id="zoomLevel" class="status-value">5</span>
    </div>
  </div>

  <!-- Leaflet JS & Leaflet.heat -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <script>
    // Initialize Leaflet Map centered over India
    const map = L.map('map', {
      center: [22.3511148, 78.6677428],
      zoom: 5,
      minZoom: 4,
      maxZoom: 18,
      zoomControl: false,
      preferCanvas: true
    });

    // Reposition zoom controls to bottom-right
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Tile Layers
    const baseLayers = {
      "CartoDB Dark": L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap, &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 19
      }),
      "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }),
      "Satellite": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; Esri World Imagery',
        maxZoom: 18
      })
    };
    baseLayers["CartoDB Dark"].addTo(map);
    L.control.layers(baseLayers, null, { position: 'bottomright' }).addTo(map);

    // Dedicated Canvas Renderer for ultra-fast point drawing
    const canvasRenderer = L.canvas({ padding: 0.5 });
    let markersLayer = L.layerGroup().addTo(map);
    let heatLayer = null;
    let isHeatmapActive = false;

    // Feature class styling tokens
    const featureColors = {
      'P': '#38bdf8', // Populated Place (Sky Blue)
      'H': '#06b6d4', // Hydrographic / Water (Cyan)
      'T': '#eab308', // Mountain / Terrain (Amber)
      'A': '#ec4899', // Administrative Division (Pink)
      'S': '#a855f7', // Spot / Station / POI (Purple)
      'V': '#22c55e', // Vegetation / Forest (Green)
      'L': '#f97316', // Area / Region (Orange)
      'R': '#ef4444'  // Road / Railroad (Red)
    };

    const featureNames = {
      'P': 'Populated Place',
      'H': 'River / Waterbody',
      'T': 'Mountain / Elevation',
      'A': 'Administrative Boundary',
      'S': 'Station / Structure / POI',
      'V': 'Forest / Nature',
      'L': 'Park / Locality',
      'R': 'Road / Route'
    };

    // State
    const activeClasses = new Set(['P', 'H', 'T', 'A', 'S', 'V']);
    let minPopulation = 0;
    let fetchDebounceTimer = null;

    // Load Points within current Viewport
    function loadViewportPoints() {
      if (isHeatmapActive) return;

      const bounds = map.getBounds();
      const zoom = map.getZoom();
      document.getElementById('zoomLevel').innerText = zoom;

      // Adjust density limit according to zoom
      let limit = 2000;
      if (zoom >= 10) limit = 4000;
      if (zoom >= 13) limit = 8000;

      const classesParam = Array.from(activeClasses).join(',');
      const url = `/api/points?min_lat=${bounds.getSouth()}&max_lat=${bounds.getNorth()}&min_lng=${bounds.getWest()}&max_lng=${bounds.getEast()}&limit=${limit}&classes=${classesParam}&min_pop=${minPopulation}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          markersLayer.clearLayers();
          document.getElementById('visibleCount').innerText = `${data.count.toLocaleString()} pts`;

          data.points.forEach(pt => {
            const color = featureColors[pt.fc] || '#94a3b8';
            let radius = 4;
            if (pt.pop > 500000) radius = 8;
            else if (pt.pop > 100000) radius = 6;
            else if (zoom >= 12) radius = 5;

            const marker = L.circleMarker([pt.lat, pt.lng], {
              renderer: canvasRenderer,
              radius: radius,
              fillColor: color,
              color: '#ffffff',
              weight: 1,
              opacity: 0.9,
              fillOpacity: 0.85
            });

            const popupContent = `
              <div class="popup-title">${pt.name}</div>
              <div class="popup-type">${featureNames[pt.fc] || pt.fc} (${pt.fcode || ''})</div>
              <table class="popup-table">
                <tr><td>Coordinates:</td><td>${pt.lat.toFixed(5)}, ${pt.lng.toFixed(5)}</td></tr>
                ${pt.pop > 0 ? `<tr><td>Population:</td><td>${pt.pop.toLocaleString()}</td></tr>` : ''}
                ${pt.elev ? `<tr><td>Elevation:</td><td>${pt.elev} m</td></tr>` : ''}
              </table>
              <a class="popup-link" href="https://www.google.com/maps/search/?api=1&query=${pt.lat},${pt.lng}" target="_blank">Open in Google Maps &rarr;</a>
            `;
            marker.bindPopup(popupContent);
            markersLayer.addLayer(marker);
          });
        })
        .catch(err => {
          console.error("Failed to load points:", err);
          document.getElementById('visibleCount').innerText = "Fetch error";
        });
    }

    // Debounced Viewport Change Handler
    function onViewportChange() {
      clearTimeout(fetchDebounceTimer);
      fetchDebounceTimer = setTimeout(loadViewportPoints, 220);
    }
    map.on('moveend', onViewportChange);
    map.on('zoomend', onViewportChange);

    // Initial Load
    loadViewportPoints();

    // Category Filter Toggle Buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const fc = btn.getAttribute('data-class');
        if (activeClasses.has(fc)) {
          activeClasses.delete(fc);
          btn.classList.remove('active');
        } else {
          activeClasses.add(fc);
          btn.classList.add('active');
        }
        loadViewportPoints();
      });
    });

    // Population Slider
    const popSlider = document.getElementById('popSlider');
    const popLabel = document.getElementById('popLabel');
    popSlider.addEventListener('input', (e) => {
      minPopulation = parseInt(e.target.value, 10);
      popLabel.innerText = minPopulation === 0 ? 'All Places' : `> ${minPopulation.toLocaleString()}`;
      onViewportChange();
    });

    // Mode Toggle: Points vs Heatmap
    const btnPointsMode = document.getElementById('btnPointsMode');
    const btnHeatmapMode = document.getElementById('btnHeatmapMode');

    btnPointsMode.addEventListener('click', () => {
      isHeatmapActive = false;
      btnPointsMode.classList.add('active-mode');
      btnHeatmapMode.classList.remove('active-mode');
      if (heatLayer) {
        map.removeLayer(heatLayer);
      }
      map.addLayer(markersLayer);
      loadViewportPoints();
    });

    btnHeatmapMode.addEventListener('click', () => {
      isHeatmapActive = true;
      btnHeatmapMode.classList.add('active-mode');
      btnPointsMode.classList.remove('active-mode');
      map.removeLayer(markersLayer);
      document.getElementById('visibleCount').innerText = "Loading Heatmap...";

      if (!heatLayer) {
        fetch('/api/heatmap')
          .then(res => res.json())
          .then(points => {
            heatLayer = L.heatLayer(points, {
              radius: 12,
              blur: 16,
              maxZoom: 9,
              gradient: { 0.2: '#06b6d4', 0.5: '#38bdf8', 0.8: '#eab308', 1.0: '#ef4444' }
            });
            heatLayer.addTo(map);
            document.getElementById('visibleCount').innerText = `${points.length.toLocaleString()} heat pts`;
          });
      } else {
        heatLayer.addTo(map);
        document.getElementById('visibleCount').innerText = "Nationwide Heatmap";
      }
    });

    // Reset View Button
    document.getElementById('btnResetView').addEventListener('click', () => {
      map.setView([22.3511148, 78.6677428], 5);
    });

    // Live Search Auto-complete
    const searchInput = document.getElementById('searchInput');
    const searchDropdown = document.getElementById('searchDropdown');
    let searchDebounceTimer = null;

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim();
      clearTimeout(searchDebounceTimer);
      if (q.length < 2) {
        searchDropdown.style.display = 'none';
        return;
      }
      searchDebounceTimer = setTimeout(() => {
        fetch(`/api/search?q=${encodeURIComponent(q)}`)
          .then(res => res.json())
          .then(results => {
            if (!results.length) {
              searchDropdown.innerHTML = '<div style="padding:10px 14px;font-size:12px;color:#94a3b8;">No locations found</div>';
              searchDropdown.style.display = 'block';
              return;
            }
            searchDropdown.innerHTML = results.map(r => `
              <div class="search-item" data-lat="${r.latitude}" data-lng="${r.longitude}" data-name="${r.name}">
                <div>
                  <div style="font-weight:600;color:#f8fafc;">${r.name}</div>
                  <div class="search-item-meta">${featureNames[r.feature_class] || r.feature_class} ${r.admin1_code ? '• State: ' + r.admin1_code : ''}</div>
                </div>
                ${r.population > 0 ? `<span class="badge">Pop: ${r.population.toLocaleString()}</span>` : ''}
              </div>
            `).join('');
            searchDropdown.style.display = 'block';

            searchDropdown.querySelectorAll('.search-item').forEach(item => {
              item.addEventListener('click', () => {
                const lat = parseFloat(item.getAttribute('data-lat'));
                const lng = parseFloat(item.getAttribute('data-lng'));
                const name = item.getAttribute('data-name');
                searchInput.value = name;
                searchDropdown.style.display = 'none';
                map.setView([lat, lng], 13);
              });
            });
          });
      }, 180);
    });

    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !searchDropdown.contains(e.target)) {
        searchDropdown.style.display = 'none';
      }
    });
  </script>
</body>
</html>
